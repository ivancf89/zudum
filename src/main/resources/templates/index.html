<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zudum - Mi Dashboard</title>

    <!-- CSS oficial -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* ===== Estilos internos ===== */

        .titulo-form,
        .titulo-catalogo {
            text-align: center;
        }

        .form-progreso {
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .form-progreso div {
            margin-bottom: 8px;
        }

        /* Catálogo */
        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
            margin: 30px 0;
        }

        .poster-item {
            text-align: center;
        }

        .poster-item img {
            width: 350px;
            height: 520px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 0 8px rgba(0,0,0,0.35);
            display: block;
            margin: 0 auto;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .poster-item:hover img {
            transform: scale(1.03);
            box-shadow: 0 0 16px rgba(0,0,0,0.45);
        }

        .poster-item p {
            font-weight: bold;
            margin-top: 8px;
        }

        .btn-agregar-listado {
            margin-top: 6px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #999;
            background-color: #ffffff;
            cursor: pointer;
        }

        .btn-agregar-listado:hover {
            background-color: #FFDE21;
        }
    </style>
</head>
<body>

    <!-- ===== Navbar ===== -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="content-container">

        <!-- ===== Registro rápido ===== -->
        <h2 class="titulo-form" id="fastProgressSection">Registrar: fast progress bar</h2>

        <form th:action="@{/progreso/guardar}" method="post" class="form-progreso">
            <div>
                <label for="quickSerieSelect">Serie:</label>
                <select id="quickSerieSelect" name="serieId" required>
                    <option value="">-- Elige una serie --</option>
                    <option th:each="s : ${series}"
                            th:value="${s.id}"
                            th:text="${s.tituloLatam}">
                    </option>
                </select>
            </div>

            <div>
                <label for="quickTemporadaSelect">Temporada:</label>
                <select id="quickTemporadaSelect" name="temporadaId" required>
                    <option value="">-- Elige temporada --</option>
                </select>
            </div>

            <div>
                <label for="quickEpisodioSelect">Episodio:</label>
                <select id="quickEpisodioSelect" name="episodioId" required>
                    <option value="">-- Elige episodio --</option>
                </select>
            </div>

            <input type="hidden" name="estado" value="VIENDO">

            <button type="submit" style="margin-top:10px;">Guardar progreso</button>
        </form>

        <!-- ===== Catálogo ===== -->
        <h2 class="titulo-catalogo">Catálogo</h2>

        <div class="grid-catalogo">
            <div th:each="s : ${series}" class="poster-item">

                <!-- ✅ RUTA CORRECTA DE IMAGEN -->
                <img th:src="@{/img/{id}.png(id=${s.id})}"
                     th:alt="'Poster de ' + ${s.tituloLatam}">

                <p th:text="${s.tituloLatam}"></p>

                <button type="button"
                        class="btn-agregar-listado"
                        th:attr="data-serie-id=${s.id}">
                    Agregar a mi listado
                </button>
            </div>
        </div>

    </div>

    <!-- ===== Footer ===== -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- ===== JS ===== -->
    <script>
        const quickSerieSelect = document.getElementById('quickSerieSelect');
        const quickTemporadaSelect = document.getElementById('quickTemporadaSelect');
        const quickEpisodioSelect = document.getElementById('quickEpisodioSelect');

        if (quickSerieSelect) {
            quickSerieSelect.addEventListener('change', function () {
                const serieId = this.value;

                quickTemporadaSelect.innerHTML = '<option value="">-- Elige temporada --</option>';
                quickEpisodioSelect.innerHTML = '<option value="">-- Elige episodio --</option>';

                if (!serieId) return;

                fetch(`/progreso/temporadas?serieId=${serieId}`)
                    .then(r => r.json())
                    .then(data => {
                        data.forEach(t => {
                            const opt = document.createElement('option');
                            opt.value = t.id;
                            opt.textContent = `Temporada ${t.numeroTemporada}`;
                            quickTemporadaSelect.appendChild(opt);
                        });
                    });
            });

            quickTemporadaSelect.addEventListener('change', function () {
                const temporadaId = this.value;

                quickEpisodioSelect.innerHTML = '<option value="">-- Elige episodio --</option>';

                if (!temporadaId) return;

                fetch(`/progreso/episodios?temporadaId=${temporadaId}`)
                    .then(r => r.json())
                    .then(data => {
                        data.forEach(e => {
                            const opt = document.createElement('option');
                            opt.value = e.id;
                            opt.textContent = `Episodio ${e.numeroEpisodio}: ${e.titulo}`;
                            quickEpisodioSelect.appendChild(opt);
                        });
                    });
            });
        }

        document.querySelectorAll('.btn-agregar-listado').forEach(btn => {
            btn.addEventListener('click', () => {
                const serieId = btn.getAttribute('data-serie-id');
                quickSerieSelect.value = serieId;
                quickSerieSelect.dispatchEvent(new Event('change'));
                document.getElementById('fastProgressSection')
                        .scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>

</body>
</html>
