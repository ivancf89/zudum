<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zudum · Catálogo</title>

    <!-- CSS oficial -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }

        .catalogo-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            padding: 12px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .catalogo-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 16px rgba(0,0,0,0.25);
        }

        .catalogo-card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 10px;
        }

        .catalogo-card h3 {
            margin: 10px 0 4px;
        }

        .catalogo-card p {
            font-size: 0.9rem;
        }

        .estado-chip {
            display: inline-block;
            padding: 4px 8px;
            margin-top: 6px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .VIENDO { background-color: #e3f2fd; color: #0d47a1; }
        .TERMINADA { background-color: #e8f5e9; color: #1b5e20; }
        .CONGELADA { background-color: #fff3e0; color: #e65100; }
        .DESEO_VER { background-color: #f3e5f5; color: #4a148c; }

        .acciones {
            margin-top: 10px;
        }

        .acciones a {
            display: inline-block;
            margin-top: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="content-container">

    <!-- =====================
         HEADER
    ====================== -->
    <h2>Catálogo de series</h2>
    <p>
        Explora las series disponibles y revisa tu estado de visualización.
    </p>

    <!-- =====================
         GRID DE SERIES
    ====================== -->
    <div class="catalogo-grid">

        <div class="catalogo-card"
             th:each="serie : ${series}">

            <!-- Poster -->
            <img th:src="@{'/img/' + ${serie.id} + '.png'}"
                 th:alt="'Poster de ' + ${serie.tituloLatam}">

            <!-- Títulos -->
            <h3 th:text="${serie.tituloLatam}"></h3>
            <p>
                <em th:text="${serie.tituloOriginal}"></em>
            </p>

            <!-- Descripción -->
            <p th:text="${serie.descripcion}"></p>

            <!-- Estado del usuario -->
            <div th:if="${progresoPorSerie[serie.id] != null}">
                <span class="estado-chip"
                      th:text="${progresoPorSerie[serie.id].estado}"
                      th:classappend="' ' + ${progresoPorSerie[serie.id].estado}">
                </span>

                <p style="margin-top: 4px; font-size: 0.85rem;">
                    T<span th:text="${progresoPorSerie[serie.id].temporadaActual}"></span>
                    ·
                    E<span th:text="${progresoPorSerie[serie.id].episodioActual}"></span>
                </p>
            </div>

            <div th:unless="${progresoPorSerie[serie.id] != null}">
                <span class="estado-chip DESEO_VER">
                    No iniciada
                </span>
            </div>

            <!-- Acciones -->
            <div class="acciones">
                <a th:href="@{'/temporadas/serie/' + ${serie.id}}">
                    Ver temporadas y episodios →
                </a>
            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
