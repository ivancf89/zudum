<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zudum - Catálogo</title>
</head>
<body>

<h1>Zudum</h1>

<!-- 🔹 Selects para registrar progreso sin escribir texto -->
<h2>Registrar progreso rápido</h2>

<form action="/progreso/marcar" method="post">
    <p>
        <label for="serieSelect">Serie:</label>
        <select id="serieSelect" name="serieId" required>
            <option value="">-- Elige una serie --</option>
            <option th:each="s : ${series}"
                    th:value="${s.id}"
                    th:text="${s.tituloLatam}">
                Dark
            </option>
        </select>
    </p>

    <p>
        <label for="tempSelect">Temporada:</label>
        <select id="tempSelect" name="temporada" required>
            <option value="">-- Elige temporada --</option>
            <option th:each="t : ${temporadas}"
                    th:value="${t.numeroTemporada}"
                    th:text="${'T' + t.numeroTemporada + ' - ' + t.serie.tituloLatam}">
                T1 - Dark
            </option>
        </select>
    </p>

    <p>
        <label for="epiSelect">Episodio:</label>
        <select id="epiSelect" name="episodio" required>
            <option value="">-- Elige episodio --</option>
            <option th:each="e : ${episodios}"
                    th:value="${e.numeroEpisodio}"
                    th:text="${'Ep ' + e.numeroEpisodio + ' - ' + e.titulo}">
                Ep 1 - El comienzo
            </option>
        </select>
    </p>

    <button type="submit">Guardar progreso</button>
</form>

<hr>

<!-- 🔹 Catálogo de tarjetas -->
<h2>Catálogo de series</h2>

<div th:each="serie : ${series}"
     style="border:1px solid #ccc; padding:10px; margin:10px; display:inline-block; width:250px;">

    <!-- Poster estático. Puedes poner /static/img/1.jpg, 2.jpg, etc. -->
    <div>
        <img th:src="@{'/img/' + ${serie.id} + '.jpg'}"
             alt="Poster"
             style="width:100%; max-height:300px; object-fit:cover;">
    </div>

    <h3 th:text="${serie.tituloLatam}">Título LATAM</h3>
    <p><em th:text="${serie.tituloOriginal}">Título original</em></p>
    <p th:text="${serie.descripcion}">Descripción</p>

    <!-- Estado desde PROGRESO_SERIE -->
    <p>
        <strong>Estado: </strong>
        <span th:if="${progresoPorSerie[serie.id] != null}"
              th:switch="${progresoPorSerie[serie.id].estado}">
            <span th:case="'VIENDO'">Viendo</span>
            <span th:case="'TERMINADA'">Terminada</span>
            <span th:case="'CONGELADA'">Congelada</span>
            <span th:case="'DESEO_VER'">Deseo ver</span>
        </span>
        <span th:unless="${progresoPorSerie[serie.id] != null}">
            No iniciada
        </span>
    </p>

    <p th:if="${progresoPorSerie[serie.id] != null}">
        Temp <span th:text="${progresoPorSerie[serie.id].temporadaActual}">1</span>,
        Ep <span th:text="${progresoPorSerie[serie.id].episodioActual}">1</span>
    </p>

    <p>
        <a th:href="@{'/temporadas/serie/' + ${serie.id}}">Ver temporadas y capítulos</a>
    </p>
</div>

<hr>

<p>
    <a href="/perfil">Ir a mi perfil</a>
</p>

</body>
</html>
