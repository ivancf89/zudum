<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zudum - Iniciar Sesión</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="content-container">
      <div>
        <h2>Iniciar Sesión en Zudum</h2>

        <!-- Mensaje de error (por ejemplo: login incorrecto) -->
        <div th:if="${error}" style="color: red; margin-bottom: 10px;">
          <span th:text="${error}"></span>
        </div>

        <!-- Mensaje de éxito (por ejemplo: "usuario registrado correctamente") -->
        <div th:if="${mensaje}" style="color: green; margin-bottom: 10px;">
          <span th:text="${mensaje}"></span>
        </div>

        <form th:action="@{/login}" method="post">
          <div>
            <label for="email">Email:</label>
            <!-- IMPORTANTE: name="email" para que el controlador reciba el parámetro correcto -->
            <input type="email" id="email" name="email" required />
          </div>
          <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button type="submit">Entrar</button>
        </form>

        <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
